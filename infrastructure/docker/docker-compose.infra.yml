services:
  db:
    image: postgres:17
    container_name: infra_pgdb
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: default
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../scripts:/docker-entrypoint-initdb.d
    networks:
      - shared_network

  nats:
    image: nats:latest
    container_name: infra_nats
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_storage:/data
    command: [ "-js", "-sd", "/data", "-V", "-D" ]
    networks:
      - shared_network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: infra_keycloak
    command: start-dev --import-realm
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    ports:
      - "8080:8080"
    volumes:
      - ../../apps/identity/config:/opt/keycloak/data/import
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://infra_pgdb:5432/identity
      KC_DB_USERNAME: user
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
    networks:
      - shared_network

  cache:
    image: redis:7.2-alpine
    container_name: infra_redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    ports:
      - "6379:6379"
    volumes:
       - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - shared_network

  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    depends_on:
      - db
      - keycloak
    networks:
      - shared_network
volumes:
  pgdata:
  nats_storage:
  redis_data:

networks:
  shared_network:
    name: cortexops_shared_network
    external: true