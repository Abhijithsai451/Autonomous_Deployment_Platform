services:
  identity:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: cortexops_identity
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "apps.identity.identity_main:app", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    env_file:
      - ../../.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://cortexops_otel_collector:4317
    networks:
      - shared_network

  organization:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: cortexops_organization
    ports:
      - "8001:8001"
    command: ["python", "-m", "uvicorn", "apps.organization.org_main:app", "--host", "0.0.0.0", "--port", "8001"]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    env_file:
      - ../../.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://cortexops_otel_collector:4317
    networks:
      - shared_network
  workflow:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: cortexops_workflow
    ports:
      - "8002:8002"
    command: [ "python", "-m", "uvicorn", "apps.workflow.workflow_main:app", "--host", "0.0.0.0", "--port", "8002" ]
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.15'
          memory: 256M
    env_file:
      - ../../.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://cortexops_otel_collector:4317
    networks:
      - shared_network
  agent_runtime:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: cortexops_agent_runtime
    ports:
      - "8003:8003"
    command: [ "python", "-m", "uvicorn", "apps.agent_runtime.agent_runtime_main:app", "--host", "0.0.0.0", "--port", "8003" ]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    env_file:
      - ../../.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://cortexops_otel_collector:4317
    networks:
      - shared_network
networks:
  shared_network:
    name: cortexops_shared_network
    external: true