version: '3.8'

services:
  identity:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: cortexops_identity
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL
      - KEYCLOAK_URL
      - KEYCLOAK_REALM
      - KEYCLOAK_CLIENT_ID
      - KEYCLOAK_CLIENT_SECRET
      - KEYCLOAK_ADMIN_USER
      - KEYCLOAK_ADMIN_PASSWORD
      - NATS_URL
    networks:
      - shared_network

networks:
  shared_network:
    name: cortexops_shared_network
    external: true