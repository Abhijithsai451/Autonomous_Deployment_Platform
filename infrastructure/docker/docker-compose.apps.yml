services:
  identity:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: cortexops_identity
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "apps.identity.identity_main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../../.env
    environment:
      - IDENTITY_DATABASE_URL
      - KEYCLOAK_URL
      - KEYCLOAK_REALM
      - KEYCLOAK_CLIENT_ID
      - KEYCLOAK_CLIENT_SECRET
      - KEYCLOAK_ADMIN_USER
      - KEYCLOAK_ADMIN_PASSWORD
      - NATS_URL
    networks:
      - shared_network

  organization:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: cortexops_organization
    ports:
      - "8001:8001"
    command: ["python", "-m", "uvicorn", "apps.organization.org_main:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - ../../.env
    environment:
      - ORGANIZATION_DATABASE_URL
      - NATS_URL

    networks:
      - shared_network
  workflow:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: cortexops_workflow
    ports:
      - "8002:8002"
    command: [ "python", "-m", "uvicorn", "apps.workflow.workflow_main:app", "--host", "0.0.0.0", "--port", "8002" ]
    env_file:
      - ../../.env
    environment:
      - WORKFLOW_DATABASE_URL
      - NATS_URL

    networks:
      - shared_network
  agent_runtime:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: cortexops_agent_runtime
    ports:
      - "8003:8003"
    command: [ "python", "-m", "uvicorn", "apps.agent_runtime.agent_runtime_main:app", "--host", "0.0.0.0", "--port", "8003" ]
    env_file:
      - ../../.env
    environment:
      - AGENT_RUNTIME_DATABASE_URL
      - NATS_URL
    networks:
      - shared_network
networks:
  shared_network:
    name: cortexops_shared_network
    external: true